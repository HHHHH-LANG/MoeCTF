<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/cute.css' | relative_url }}">
</head>
<body>
  <div class="doodle doodle-a" aria-hidden="true">✿</div>
  <div class="doodle doodle-b" aria-hidden="true">☁</div>
  <div class="doodle doodle-c" aria-hidden="true">✧</div>
  <div class="doodle doodle-d" aria-hidden="true">🐾</div>
  <div class="doodle doodle-e" aria-hidden="true">🐾</div>

  <header class="site-head">
    <a class="logo" href="{{ '/' | relative_url }}">
      <span class="logo-mark">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path d="M15 31 L13 11 L28 21" fill="#fff" stroke="#ff7fa8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M49 31 L51 11 L36 21" fill="#fff" stroke="#ff7fa8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M32 18 C18 18 10 29 10 38 C10 48 20 56 32 56 C44 56 54 48 54 38 C54 29 46 18 32 18 Z" fill="#fff" stroke="#ff7fa8" stroke-width="3.5"/>
          <path d="M21 36 q4.5 -4.5 9 0" stroke="#7a5aa8" stroke-width="3" stroke-linecap="round"/>
          <path d="M34 36 q4.5 -4.5 9 0" stroke="#7a5aa8" stroke-width="3" stroke-linecap="round"/>
          <path d="M32 42 l2.6 2.4 -2.6 2.2 -2.6 -2.2 z" fill="#ff7fa8"/>
          <path d="M32 47 q-3 3 -5 0 M32 47 q3 3 5 0" stroke="#e8577f" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="17" cy="44" rx="4.5" ry="2.6" fill="#ffd0e0"/>
          <ellipse cx="47" cy="44" rx="4.5" ry="2.6" fill="#ffd0e0"/>
          <path d="M6 40 h7 M6 45 h7 M51 40 h7 M51 45 h7" stroke="#ffb3c9" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="logo-text">HHHHH<em>の</em>BLOG</span>
    </a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="https://github.com/HHHHH-LANG" rel="noreferrer">GitHub</a>
    </nav>
  </header>

  <main class="card">
    <div class="cat-peek" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M15 31 L13 11 L28 21" fill="#fff" stroke="#ff7fa8" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M49 31 L51 11 L36 21" fill="#fff" stroke="#ff7fa8" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M32 18 C18 18 10 29 10 38 C10 48 20 56 32 56 C44 56 54 48 54 38 C54 29 46 18 32 18 Z" fill="#fff" stroke="#ff7fa8" stroke-width="3.5"/>
        <path d="M21 36 q4.5 -4.5 9 0" stroke="#7a5aa8" stroke-width="3" stroke-linecap="round"/>
        <path d="M34 36 q4.5 -4.5 9 0" stroke="#7a5aa8" stroke-width="3" stroke-linecap="round"/>
        <path d="M32 42 l2.6 2.4 -2.6 2.2 -2.6 -2.2 z" fill="#ff7fa8"/>
        <path d="M32 47 q-3 3 -5 0 M32 47 q3 3 5 0" stroke="#e8577f" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="17" cy="44" rx="4.5" ry="2.6" fill="#ffd0e0"/>
        <ellipse cx="47" cy="44" rx="4.5" ry="2.6" fill="#ffd0e0"/>
        <path d="M6 40 h7 M6 45 h7 M51 40 h7 M51 45 h7" stroke="#ffb3c9" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    {{ content }}
  </main>

  <footer class="site-foot">
    <span>Made with 🍓 &amp; ☕</span>
    <span class="sep">·</span>
    <span>🐱 小猫监工中</span>
    <span class="sep">·</span>
    <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
  </footer>
</body>
</html>
